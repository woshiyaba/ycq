spring:
  application:
    name: user-service
  cloud:
    stream:
      bindings:
        register-input:
          destination: register
          group: registerGroup
  profiles:
    active: ${SPRING_PROFILE_ACTIVE:dev}

mybatis:
  configuration:
    map-underscore-to-camel-case: true

jwt:
  pub-key-file-name: RSA.pub

logging:
  level:
    org.springframework.web: info
    io.github.nnkwrik.userservice: debug
